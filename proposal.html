<!doctype html>
<html lang="ko" data-lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fast campus 시애틀 협업 제안서</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <script>
    (function () {
      var p = new URLSearchParams(location.search).get('lang');
      var lang = p === 'en' || p === 'ko' ? p : (navigator.language || '').toLowerCase().indexOf('ko') === 0 ? 'ko' : 'en';
      document.documentElement.dataset.lang = lang;
      document.documentElement.lang = lang;
    })();
  </script>
  <style>
    :root { color-scheme: light; --red: #fc1c49; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1b1b1d; color: #fff; font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    html[data-lang="ko"] [lang="en"], html[data-lang="en"] [lang="ko"] { display: none !important; }
    .bar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px; background: rgba(27, 27, 29, .9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      font-size: 14px;
    }
    .bar a { color: #fff; text-decoration: none; white-space: nowrap; }
    .bar .download { background: var(--red); padding: 8px 14px; border-radius: 999px; font-weight: 700; }
    .note { text-align: center; font-size: 12px; color: #a0a0a4; padding: 4px 16px 0; }
    .slides { max-width: 1100px; margin: 0 auto; padding: 12px 12px 40px; display: grid; gap: 12px; }
    .slides img { width: 100%; height: auto; aspect-ratio: 16 / 9; display: block; border-radius: 6px; background: #2a2a2d; }
    .end { text-align: center; padding: 8px 16px 48px; }
    .end a { color: #fff; font-size: 14px; }
  </style>
</head>
<body>
  <nav class="bar">
    <a class="back" href="index.html" data-keep-lang>← <span lang="ko">팜플렛으로</span><span lang="en">Back</span></a>
    <a class="download" href="proposal/fastcampus-seattle-proposal.pdf" download><span lang="ko">PDF 다운로드</span><span lang="en">Download PDF</span></a>
  </nav>
  <p class="note"><span lang="ko">손가락으로 확대해서 볼 수 있어요</span><span lang="en">This proposal is written in Korean · Pinch to zoom</span></p>
  <main class="slides" id="slides"></main>
  <p class="end"><a href="index.html" data-keep-lang>← <span lang="ko">팜플렛으로 돌아가기</span><span lang="en">Back to brochure</span></a></p>

  <script>
    var PAGES = 16;
    var slides = document.getElementById('slides');
    for (var i = 1; i <= PAGES; i++) {
      var img = document.createElement('img');
      img.src = 'proposal/p-' + String(i).padStart(2, '0') + '.jpg';
      img.alt = 'Slide ' + i;
      img.width = 1600;
      img.height = 900;
      if (i > 2) img.loading = 'lazy';
      slides.appendChild(img);
    }
    var lang = document.documentElement.dataset.lang;
    document.querySelectorAll('a[data-keep-lang]').forEach(function (a) {
      a.href = 'index.html?lang=' + lang;
    });
  </script>
</body>
</html>
